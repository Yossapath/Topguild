<div id="authWrap" style="display: grid; place-items: center; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: linear-gradient(135deg, #e3f2fd, #bbdefb); z-index: 10000; overflow: hidden; padding: 20px; box-sizing: border-box;">
  <div style="background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; margin: 0 auto;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <h2 style="margin: 0; color: #1e3a8a; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Row Topguild</h2>
    </div>
    <!-- Login Form -->
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group" style="margin-bottom: 20px;">
        <label style="font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; font-size: 14px;">Username Game</label>
        <input type="text" id="loginUsername" style="width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; transition: border-color 0.2s;" placeholder="ชื่อตัวละครของคุณ" required>
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label style="font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; font-size: 14px;">Password</label>
        <input type="password" id="loginPassword" style="width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; transition: border-color 0.2s;" placeholder="รหัสผ่าน" required>
      </div>
      <button type="submit" style="width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,0.2);">เข้าสู่ระบบ</button>
      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b;">
        ยังไม่มีบัญชีใช่หรือไม่? <a href="#" onclick="toggleAuthMode('register'); return false;" style="color: #2563eb; font-weight: 600; text-decoration: none;">สมัครสมาชิก</a>
      </div>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="registerForm" style="display: none;" onsubmit="event.preventDefault(); handleRegister();">
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; font-size: 14px;">Username Game</label>
        <input type="text" id="regUsername" style="width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; transition: border-color 0.2s;" placeholder="ชื่อตัวละครของคุณ" required>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; font-size: 14px;">Class (อาชีพ)</label>
        <select id="regJob" style="width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; transition: border-color 0.2s;" required>
          <option value="" disabled selected>-- เลือกอาชีพ --</option>
          <option value="Lord Knight">Lord Knight</option>
          <option value="Paladin">Paladin</option>
          <option value="High Wizard">High Wizard</option>
          <option value="Sniper">Sniper</option>
          <option value="Priest">Priest</option>
          <option value="Champion">Champion</option>
          <option value="Assassin Cross">Assassin Cross</option>
          <option value="Mastersmith">Mastersmith</option>
          <option value="Gunslinger">Gunslinger</option>
          <option value="Druid">Druid</option>
        </select>
        
      </div>
      <div class="form-group" style="margin-bottom: 24px;">
        <label style="font-weight: 700; color: #1e3a8a; margin-bottom: 8px; display: block; font-size: 14px;">Password</label>
        <input type="password" id="regPassword" style="width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #334155; transition: border-color 0.2s;" placeholder="รหัสผ่าน" required>
      </div>
      <button type="submit" style="width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; box-shadow: 0 4px 12px rgba(5,150,105,0.2);">สมัครสมาชิกใหม่</button>
      <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #64748b;">
        มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleAuthMode('login'); return false;" style="color: #2563eb; font-weight: 600; text-decoration: none;">เข้าสู่ระบบ</a>
      </div>
    </form>
  </div>
</div>
